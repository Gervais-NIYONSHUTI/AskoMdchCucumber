name: build at 12:35 pm

on:
  schedule:
    - cron: 35 12 * * *
jobs:
  nightly-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: run with Tests
        run: mvn test

      - name: run with Maven
        run: mvn -DskipTests -B package --no-transfer-progress --file ./pom.xml

      - uses: actions/upload-artifact@master
        with:
          name: digibank.war
          path: ./target/*digitalbank*.war
          
    
